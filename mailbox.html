<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <title>Evan × Yuki · 信箱主页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --mist-blue: #A8B0BC;
      --warm-apricot: #F0E0D0;
      --off-white: #F5F5F0;
      --text-main: #33343a;
      --card-shadow: 0 14px 35px rgba(0,0,0,0.06);
      --radius-lg: 18px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #f7f5f2, #f3f4f6);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .page {
      width: 100%;
      max-width: 800px;
      padding: 24px 16px 36px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 8px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.9);
      box-shadow: var(--card-shadow);
      font-size: 12px;
      text-decoration: none;
      color: var(--text-main);
    }
    .top-title h1 {
      font-size: 18px;
      letter-spacing: 0.1em;
    }
    .top-title p {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 3px;
    }

    .mail-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .mail-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .mail-card {
      display: block;
      height: 100%;
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,0.95);
      box-shadow: var(--card-shadow);
      padding: 16px 18px;
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .mail-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.09);
      background: #ffffff;
    }
    .mail-card-title {
      font-size: 15px;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .mail-card-subtitle {
      font-size: 12px;
      opacity: 0.75;
      margin-bottom: 10px;
    }
    .mail-card-meta {
      font-size: 11px;
      opacity: 0.65;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <a class="back-link" href="index.html">
        <span>←</span><span>回到小猫的家</span>
      </a>
      <div class="top-title">
        <h1>Evan × Yuki · 信箱</h1>
        <p>小情书和碎碎念，都有各自的小抽屉。</p>
      </div>
    </header>

    <main>
      <div class="mail-grid">
        <!-- 小情书入口 -->
        <a class="mail-card" href="mailbox-letters.html">
          <div class="mail-card-title">📮 小情书信箱</div>
          <div class="mail-card-subtitle">
            写给 Yuki 的长信、小纸条，按时间排好，一封一封打开。
          </div>
          <div class="mail-card-meta">
            从 2025 年冬天开始的所有小情书，慢慢往这里搬。
          </div>
        </a>

        <!-- 碎碎念入口 -->
        <a class="mail-card" href="mailbox-snippets.html">
          <div class="mail-card-title">📝 碎碎念 · Snippets</div>
          <div class="mail-card-subtitle">
            不够长成一封信的小句子、小段落、小旁白。
          </div>
          <div class="mail-card-meta">
            适合收藏你喜欢的一两句话、奇奇怪怪的小想法。
          </div>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
